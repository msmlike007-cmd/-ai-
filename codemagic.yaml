
workflows:
  android-workflow:
    name: Ayesha AI Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Install Flutter dependencies
        script: |
          cd flutter_app
          flutter pub get

      - name: Build Android APK
        script: |
          cd flutter_app
          flutter build apk --release

    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/*.apk
      
