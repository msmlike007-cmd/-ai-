
workflows:
  android-workflow:
    name: Ayesha AI Android Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter pub get

      - name: Build release APK
        script: |
          cd flutter_app
          flutter build apk --release

    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/*.apk
      
